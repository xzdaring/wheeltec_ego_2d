waypoint_runner:
  ros__parameters:
    # 每四个数是一组 x、y、z（米）、yaw（弧度）。默认按 RViz map 坐标解释。
    goal_frame: map
    waypoints: [-0.5, -6.5, 0.08, -1.57 ,
                -10.0, -3.0, 0.08, 3.14,
                -1.0, 4.0, 0.08, 0.0                                               
                ]
    waypoint_timeout: 300.0
